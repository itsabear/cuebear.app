			shellScript = "echo \"🔧 Bundling libraries...\"\nAPP_BUNDLE=\"${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}\"\nFRAMEWORKS_DIR=\"${APP_BUNDLE}/Contents/Frameworks\"\n\n# Copy universal libraries\necho \"📦 Copying universal libraries...\"\nmkdir -p \"$FRAMEWORKS_DIR\"\ncp \"${SRCROOT}/Frameworks/\"*.dylib \"$FRAMEWORKS_DIR/\" || echo \"⚠️  Failed to copy libraries\"\necho \"✅ Libraries copied\"\n\n# v1.2.4: the USB tunnel runs inside the Bridge; the iproxy helper is no longer bundled.\nrm -f \"${APP_BUNDLE}/Contents/MacOS/iproxy\"\n\n# Re-sign libraries and app bundle after copying\necho \"🔏 Code signing libraries and app bundle...\"\n\n# Sign each library individually first\nfor lib in \"$FRAMEWORKS_DIR\"/*.dylib; do\n  if [ -f \"$lib\" ]; then\n    echo \"  Signing $(basename \"$lib\")...\"\n    codesign --force --sign - \"$lib\" || echo \"⚠️  Failed to sign $(basename \"$lib\")\"\n  fi\ndone\n\n# Then sign the app bundle\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  # For Debug builds, use ad-hoc signing\n  codesign --force --deep --sign - \"$APP_BUNDLE\" || echo \"⚠️  Code signing failed\"\n  echo \"✅ App bundle signed (ad-hoc)\"\nelse\n  # For Release builds, also use ad-hoc signing (will be properly signed later for distribution)\n  codesign --force --deep --sign - \"$APP_BUNDLE\" || echo \"⚠️  Code signing failed\"\n  echo \"✅ App bundle signed (ad-hoc for local testing)\"\nfi\n\nexit 0\n";
